---
- name: Install and Configure Node Exporter
  hosts: all:!control_center
  become: yes
  vars:
    node_exporter_version: "1.8.1" # Use the latest stable version
    download_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"

  tasks:
    - name: Create prometheus system group
      group:
        name: prometheus
        system: yes
        state: present

    - name: Create prometheus system user
      user:
        name: prometheus
        group: prometheus
        system: yes
        shell: /sbin/nologin
        create_home: no
        state: present

    - name: Ensure configuration directory exists
      file:
        path: /etc/node_exporter
        state: directory
        owner: prometheus
        group: prometheus
        mode: '0755'

    - name: Download and unarchive Node Exporter binary
      unarchive:
        src: "{{ download_url }}"
        dest: /tmp
        remote_src: yes

    - name: Copy binary to standard executable path
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: /usr/local/bin/node_exporter
        remote_src: yes
        owner: prometheus
        group: prometheus
        mode: '0755'

    - name: Create Systemd service file
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Node Exporter
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=prometheus
          Group=prometheus
          Type=simple
          ExecStart=/usr/local/bin/node_exporter

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: '0644'

    - name: Force systemd to reload config and start service
      systemd:
        name: node_exporter
        state: restarted
        enabled: yes
        daemon_reload: yes
